<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPINBOUND</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="warehouse">

        <!-- Creepy background details -->
        <div class="mould mould-one"></div>
        <div class="mould mould-two"></div>
        <div class="mould mould-three"></div>

        <div class="crack crack-one"></div>
        <div class="crack crack-two"></div>


        <!-- Main machine -->

        <main class="game">

            <header>

                <div class="warning">
                    ⚠
                </div>

                <div>
                    <h1>SPINBOUND</h1>
                    <p>KEEP SPINNING.</p>
                </div>

            </header>


            <div class="game-content">


                <!-- =========================
                     LEFT SIDE
                ========================== -->

                <section class="wheel-panel">

                    <div class="panel-label">
                        // MACHINE 01
                    </div>

                    <div class="wheel-wrapper">

                        <div class="pointer">
                            ▼
                        </div>

                        <div class="wheel" id="wheel">

                            <div class="wheel-segment win">
                                WIN
                            </div>

                            <div class="wheel-segment lose">
                                LOSE
                            </div>

                            <div class="wheel-hub">

                                <div class="hub-center"></div>

                            </div>

                        </div>

                    </div>


                    <button id="spinButton">
                        SPIN
                    </button>


                    <div id="result">
                        INSERT COURAGE.
                    </div>

                </section>



                <!-- =========================
                     RIGHT SIDE
                ========================== -->

                <section class="information">


                    <!-- MONEY -->

                    <div class="stat-box money-box">

                        <span>MONEY</span>

                        <strong id="money">
                            $100
                        </strong>

                    </div>


                    <!-- QUOTA -->

                    <div class="stat-box quota-box">

                        <span>QUOTA</span>

                        <strong id="quota">
                            $150
                        </strong>

                    </div>


                    <!-- SPINS -->

                    <div class="stat-box spins-box">

                        <span>SPINS REMAINING</span>

                        <strong id="spins">
                            10
                        </strong>

                    </div>


                    <!-- UPGRADES -->

                    <div class="upgrade-box">

                        <div class="upgrade-header">

                            <span>
                                WHEEL MODIFICATIONS
                            </span>

                            <span id="upgradeCount">
                                0 / 5
                            </span>

                        </div>


                        <div id="upgradeList" class="upgrade-list">

                            <div class="empty">
                                NO MODIFICATIONS
                            </div>

                        </div>

                    </div>

                </section>

            </div>


            <!-- ROUND -->

            <footer>

                ROUND
                <span id="round">
                    1
                </span>

            </footer>

        </main>

    </div>



    <!-- GAME OVER -->

    <div id="gameOver" class="overlay hidden">

        <div class="game-over-box">

            <div class="dead-light"></div>

            <h2>
                QUOTA FAILED
            </h2>

            <p id="gameOverReason">
                YOU RAN OUT OF SPINS.
            </p>

            <button id="restartButton">
                TRY AGAIN
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
