<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SPINBOUND</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game">

        <header>
            <h1>SPINBOUND</h1>
            <p>HOW FAR CAN YOU SPIN?</p>
        </header>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">
                <span>MONEY</span>
                <strong id="money">$100</strong>
            </div>

            <div class="stat">
                <span>QUOTA</span>
                <strong id="quota">$150</strong>
            </div>

            <div class="stat">
                <span>SPINS</span>
                <strong id="spins">10</strong>
            </div>

        </section>


        <!-- WHEEL -->

        <section class="wheel-area">

            <div class="pointer">▼</div>

            <div class="wheel" id="wheel">

                <div class="wheel-text win">
                    WIN
                </div>

                <div class="wheel-text lose">
                    LOSE
                </div>

                <div class="wheel-center"></div>

            </div>

            <button id="spinButton">
                SPIN
            </button>

            <div id="result">
                READY?
            </div>

        </section>


        <!-- UPGRADES -->

        <section class="upgrade-section">

            <div class="upgrade-title">
                <span>YOUR UPGRADES</span>
                <span id="upgradeCount">0 / 5</span>
            </div>

            <div id="upgradeList" class="upgrade-list">
                <div class="empty">
                    NO UPGRADES
                </div>
            </div>

        </section>


        <!-- ROUND -->

        <div class="round">
            ROUND <span id="round">1</span>
        </div>

    </main>


    <!-- GAME OVER SCREEN -->

    <div id="gameOver" class="overlay hidden">

        <div class="game-over-box">

            <h2>GAME OVER</h2>

            <p id="gameOverReason">
                YOU FAILED THE QUOTA.
            </p>

            <button id="restartButton">
                TRY AGAIN
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
